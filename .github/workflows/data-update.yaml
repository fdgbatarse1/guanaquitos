name: Data update

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update scholarships and careers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run pipeline
        run: npm run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GEOCODING_API_KEY: ${{ secrets.GOOGLE_GEOCODING_API_KEY }}
          EXTRACTION_MODEL: ${{ vars.EXTRACTION_MODEL }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data-update
          add-paths: frontend/data
          title: 'chore(data): update scholarships and careers'
          commit-message: 'chore(data): update scholarships and careers'
          body-path: frontend/pipeline-summary.md
